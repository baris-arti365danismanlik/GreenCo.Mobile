<!DOCTYPE html>
<html>
<head>
  <title>Toplu Şifre Güncelleme</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #f0f2f5;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    button {
      background: #0066cc;
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: background 0.3s;
    }
    button:hover {
      background: #0052a3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .progress {
      margin: 20px 0;
      height: 30px;
      background: #e9ecef;
      border-radius: 6px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0066cc, #00a8ff);
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 6px;
      display: none;
    }
    .result.show {
      display: block;
    }
    .success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .user-table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 13px;
    }
    .user-table th {
      background: #f8f9fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #dee2e6;
    }
    .user-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e9ecef;
    }
    .user-table tr:hover {
      background: #f8f9fa;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-admin { background: #dc3545; color: white; }
    .badge-manager { background: #007bff; color: white; }
    .badge-operations { background: #ffc107; color: #000; }
    .badge-personnel { background: #6c757d; color: white; }
    .copy-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 15px;
    }
    .copy-btn:hover {
      background: #218838;
    }
    code {
      background: #f8f9fa;
      padding: 2px 6px;
      border-radius: 3px;
      color: #e83e8c;
      font-family: 'Courier New', monospace;
    }
    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #0066cc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Toplu Şifre Güncelleme</h1>
    <p class="subtitle">Tüm kullanıcı şifrelerini güçlü bir şifreye değiştirin</p>

    <div class="info-box">
      <strong>ℹ️ Bilgi:</strong> Bu araç tüm kullanıcıların şifrelerini <code>GreenCo2025!</code> olarak güncelleyecek.
      <br>İşlem sonunda size güncel kullanıcı listesi verilecek.
    </div>

    <button id="updateBtn" onclick="updateAllPasswords()">
      🚀 Tüm Şifreleri Güncelle
    </button>

    <div class="progress" id="progressBar">
      <div class="progress-bar" id="progressBarFill">0%</div>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://liwmgomavamrhzxvptla.supabase.co';
    const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpd21nb21hdmFtcmh6eHZwdGxhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTczMjY5NjQwNSwiZXhwIjoyMDQ4MjcyNDA1fQ.cUhDHKUqABQDWVfAjmVLWqE2YFXLC5fDqr4nGh7Fv8Y';
    const NEW_PASSWORD = 'GreenCo2025!';

    const supabaseAdmin = createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY, {
      auth: {
        autoRefreshToken: false,
        persistSession: false,
      },
    });

    const users = [
      {id: "f70ba0b8-2f7d-427e-810d-17115e1c0484", full_name: "Admin", phone: "+905551111111", role: "admin"},
      {id: "bea51ab5-8aae-45c4-9f45-5d974f25cbd0", full_name: "Berat", phone: "+905551234567", role: "admin"},
      {id: "2a5f23e3-da2e-4ed3-a004-8c448c97c3bb", full_name: "Berat Admin", phone: "+905559999999", role: "admin"},
      {id: "9e2606c4-d436-4b35-ad72-e608288483f6", full_name: "Test Admin", phone: "+905552222222", role: "admin"},
      {id: "e57b0a55-1446-4fb3-8855-9f446fa242d6", full_name: "op yön", phone: "+905455454545", role: "project_manager"},
      {id: "5c6491bc-ab53-4357-b581-416854134a66", full_name: "pro yön", phone: "+905445444444", role: "project_manager"},
      {id: "fae454e2-c1f2-4d7a-b50c-e6342b521431", full_name: "daad fdafs af", phone: "+905556663322", role: "operations"},
      {id: "bfd9bbe1-05bb-4cd9-be15-112ac72a807b", full_name: "bbb ccc", phone: "+905553333333", role: "personnel"},
      {id: "8eb9a0ea-dec0-4d1f-99a9-17308e87039d", full_name: "cccc fff", phone: "+905552562255", role: "personnel"},
      {id: "ed79721e-bd92-4bba-a78a-dd164da47416", full_name: "sad asdqwdq", phone: "+905556859632", role: "personnel"},
      {id: "2f9592e5-9a85-4d02-a381-68b83d81431d", full_name: "sasa asda", phone: "+905445552233", role: "personnel"},
      {id: "9dcdd13a-f1a5-4407-b97d-e880b9a0f463", full_name: "sasdfa sda", phone: "+905556589852", role: "personnel"},
      {id: "155768ea-5ee8-4ef4-8e7d-fae3e303c561", full_name: "sdad fasfsf", phone: "+905556529163", role: "personnel"},
    ];

    window.updateAllPasswords = async function() {
      const btn = document.getElementById('updateBtn');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressBarFill');
      const resultDiv = document.getElementById('result');

      btn.disabled = true;
      btn.textContent = '⏳ İşlem yapılıyor...';
      progressBar.style.display = 'block';
      resultDiv.classList.remove('show');

      const results = [];
      let successCount = 0;

      for (let i = 0; i < users.length; i++) {
        const user = users[i];
        const progress = Math.round(((i + 1) / users.length) * 100);
        progressFill.style.width = progress + '%';
        progressFill.textContent = `${i + 1}/${users.length} - ${user.full_name}`;

        try {
          const { error } = await supabaseAdmin.auth.admin.updateUserById(
            user.id,
            { password: NEW_PASSWORD }
          );

          if (error) throw error;

          results.push({ ...user, status: 'success' });
          successCount++;
        } catch (error) {
          results.push({ ...user, status: 'error', error: error.message });
        }

        await new Promise(resolve => setTimeout(resolve, 200));
      }

      progressBar.style.display = 'none';
      btn.disabled = false;
      btn.textContent = '🚀 Tüm Şifreleri Güncelle';

      const roleLabels = {
        'admin': 'Admin',
        'project_manager': 'Proje Yön.',
        'operations': 'Operasyon',
        'personnel': 'Personel'
      };

      const roleBadges = {
        'admin': 'badge-admin',
        'project_manager': 'badge-manager',
        'operations': 'badge-operations',
        'personnel': 'badge-personnel'
      };

      resultDiv.className = 'result success show';
      resultDiv.innerHTML = `
        <h3 style="margin-top: 0;">✅ Şifre Güncelleme Tamamlandı!</h3>
        <p><strong>Başarılı:</strong> ${successCount}/${users.length}</p>
        <p><strong>Yeni Şifre:</strong> <code>${NEW_PASSWORD}</code></p>

        <button class="copy-btn" onclick="copyCredentials()">📋 Tüm Bilgileri Kopyala</button>

        <table class="user-table">
          <thead>
            <tr>
              <th>Ad Soyad</th>
              <th>Telefon</th>
              <th>Rol</th>
              <th>Şifre</th>
              <th>Durum</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(u => `
              <tr>
                <td><strong>${u.full_name}</strong></td>
                <td><code>${u.phone}</code></td>
                <td><span class="badge ${roleBadges[u.role]}">${roleLabels[u.role]}</span></td>
                <td><code>${NEW_PASSWORD}</code></td>
                <td>${u.status === 'success' ? '✅' : '❌'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 6px; border-left: 4px solid #ffc107;">
          <strong>⚠️ Önemli Not:</strong>
          <ul style="margin: 10px 0 0 20px; line-height: 1.8;">
            <li>Tüm kullanıcılar artık <code>${NEW_PASSWORD}</code> şifresi ile giriş yapabilir</li>
            <li>Giriş yaparken telefon numarasını tam olarak yazın (örn: <code>+905551111111</code>)</li>
            <li>Bu listeyi güvenli bir yerde saklayın</li>
          </ul>
        </div>
      `;
    };

    window.copyCredentials = function() {
      const text = users.map(u =>
        \`\${u.full_name.padEnd(20)} | \${u.phone.padEnd(15)} | \${u.role.padEnd(20)} | GreenCo2025!\`
      ).join('\\n');

      const fullText = \`GREENCO KULLANICI BİLGİLERİ
Güncelleme Tarihi: \${new Date().toLocaleString('tr-TR')}
Yeni Şifre: GreenCo2025!

\${'-'.repeat(80)}
AD SOYAD             | TELEFON         | ROL                  | ŞİFRE
\${'-'.repeat(80)}
\${text}
\${'-'.repeat(80)}

NOT: Tüm kullanıcılar aynı şifreyle giriş yapabilir.
\`;

      navigator.clipboard.writeText(fullText).then(() => {
        alert('✅ Tüm kullanıcı bilgileri panoya kopyalandı!');
      });
    };
  </script>
</body>
</html>
