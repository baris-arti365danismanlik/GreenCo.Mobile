<!DOCTYPE html>
<html>
<head>
  <title>Create Technical Users Pool</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .user { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 0; }
    #log { margin-top: 20px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Create Technical Users Pool</h1>

  <div>
    <h3>Supabase Configuration</h3>
    <label>Supabase URL:</label><br>
    <input type="text" id="supabaseUrl" style="width: 100%; padding: 8px; margin: 5px 0;" placeholder="https://xxx.supabase.co"><br>

    <label>Supabase Anon Key:</label><br>
    <input type="text" id="supabaseKey" style="width: 100%; padding: 8px; margin: 5px 0;"><br>

    <label>Admin Phone:</label><br>
    <input type="text" id="adminPhone" value="+905551234567" style="width: 100%; padding: 8px; margin: 5px 0;"><br>

    <label>Admin Password:</label><br>
    <input type="password" id="adminPassword" value="GreenCo2025!" style="width: 100%; padding: 8px; margin: 5px 0;"><br>
  </div>

  <button onclick="createAllUsers()">Create All Technical Users</button>

  <div id="log"></div>

  <script>
    const users = [
      // Operations Users
      { phone: '+905451111001', password: 'GreenCo2025!', full_name: 'Ahmet Yılmaz', role: 'operations', service_modules: ['technical'] },
      { phone: '+905451111002', password: 'GreenCo2025!', full_name: 'Mehmet Kaya', role: 'operations', service_modules: ['technical'] },
      { phone: '+905451111003', password: 'GreenCo2025!', full_name: 'Ayşe Demir', role: 'operations', service_modules: ['technical'] },
      { phone: '+905451111004', password: 'GreenCo2025!', full_name: 'Fatma Şahin', role: 'operations', service_modules: ['technical'] },
      { phone: '+905451111005', password: 'GreenCo2025!', full_name: 'Ali Yıldız', role: 'operations', service_modules: ['technical'] },

      // Project Managers
      { phone: '+905452222001', password: 'GreenCo2025!', full_name: 'Hasan Çelik', role: 'project_manager', service_modules: ['technical'] },
      { phone: '+905452222002', password: 'GreenCo2025!', full_name: 'Zeynep Arslan', role: 'project_manager', service_modules: ['technical'] },
      { phone: '+905452222003', password: 'GreenCo2025!', full_name: 'Murat Öztürk', role: 'project_manager', service_modules: ['technical'] },
      { phone: '+905452222004', password: 'GreenCo2025!', full_name: 'Elif Aydın', role: 'project_manager', service_modules: ['technical'] },
      { phone: '+905452222005', password: 'GreenCo2025!', full_name: 'Can Yılmaz', role: 'project_manager', service_modules: ['technical'] }
    ];

    function log(message, isError = false) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'user ' + (isError ? 'error' : 'success');
      entry.textContent = message;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function createAllUsers() {
      const supabaseUrl = document.getElementById('supabaseUrl').value;
      const supabaseKey = document.getElementById('supabaseKey').value;
      const adminPhone = document.getElementById('adminPhone').value;
      const adminPassword = document.getElementById('adminPassword').value;

      if (!supabaseUrl || !supabaseKey) {
        alert('Please enter Supabase URL and Key');
        return;
      }

      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      document.getElementById('log').innerHTML = '';
      log('Starting user creation...');

      try {
        // Login as admin
        log(`Logging in as admin: ${adminPhone}`);
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          phone: adminPhone,
          password: adminPassword,
        });

        if (authError) {
          log(`Login failed: ${authError.message}`, true);
          return;
        }

        log('✓ Logged in successfully');

        // Create each user
        let successCount = 0;
        let errorCount = 0;

        for (const user of users) {
          try {
            log(`Creating user: ${user.full_name} (${user.phone})...`);

            const response = await fetch(`${supabaseUrl}/functions/v1/create-user`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authData.session.access_token}`,
              },
              body: JSON.stringify(user),
            });

            const result = await response.json();

            if (response.ok) {
              log(`✓ Created: ${user.full_name} - ${user.role}`);
              successCount++;
            } else {
              log(`✗ Failed: ${user.full_name} - ${result.error || 'Unknown error'}`, true);
              errorCount++;
            }
          } catch (err) {
            log(`✗ Error creating ${user.full_name}: ${err.message}`, true);
            errorCount++;
          }
        }

        log(`\n=== SUMMARY ===`);
        log(`Total users: ${users.length}`);
        log(`✓ Success: ${successCount}`);
        log(`✗ Failed: ${errorCount}`);
        log(`\nAll passwords: GreenCo2025!`);

      } catch (error) {
        log(`Fatal error: ${error.message}`, true);
      }
    }
  </script>
</body>
</html>
